services:
  config-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: queryguardian
      MYSQL_USER: qg
      MYSQL_PASSWORD: qg
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - config-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uqg", "-pqg"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  config-db-data:
